name: deploy

# Landing deploy pipeline (GitHub Actions — Cloudflare Builds is disconnected).
#
#   push to master       -> build + wrangler preview --name latest
#                           Updates the stable preview (latest.<preview-host>)
#                           for internal/stakeholder review. Not public.
#   release published    -> build + wrangler deploy
#                           Promotes to production (ratas.ai).
#
# Secrets required (repo settings):
#   CLOUDFLARE_API_TOKEN   - token with Workers Scripts: Edit (+ the account)
#   CLOUDFLARE_ACCOUNT_ID  - Cloudflare account ID
#
# Notes:
# - PR preview URLs (workers.dev) are produced by Workers Previews separately;
#   this workflow handles the stable master preview + production only.
# - Build command mirrors package.json (astro build). If theme CSS is not
#   committed, add `npm run build:themes` before the build step.

on:
  push:
    branches: [master]
  release:
    types: [published]

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  # ---- master -> stable preview (internal review) ----
  preview:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Deploy preview (latest)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: preview --name preview

  # ---- release -> production ----
  deploy:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment: prod # add required reviewers for an extra gate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Deploy production
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
